<!doctype html><html lang="ru"><meta charset="utf-8"><title>Эффекты боя — просмотр графики</title>
<style>*{box-sizing:border-box}body{background:#141a18;color:#e5e6dd;font:15px system-ui;margin:24px}h1{font-size:26px;margin-bottom:8px}p{color:#adb8ac;max-width:1000px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0}button,select{background:#303c34;color:inherit;border:1px solid #5b6b59;padding:9px;border-radius:5px}#grid{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:16px}article{border:1px solid #3d4c40;border-radius:8px;overflow:hidden;background:#202923}h2{font-size:16px;padding:0 14px}small{display:block;color:#b1baa9;padding:0 14px 14px}canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated}body.light canvas{background:#bdc7b5}@media(max-width:1000px){#grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){#grid{grid-template-columns:1fr}}</style>
<h1>Споры, кровь и попадания</h1><p>16 анимаций · 96 кадров · неподвижная лужа. Это локальный просмотр графики. Короткие эффекты здесь повторяются с паузой для оценки; в игре они однократные. Лужа удерживает последний кадр до кнопки «Сначала».</p>
<nav><select id="category"><option value="all">Все эффекты</option><option value="spores">Споры</option><option value="blood">Кровь и лужа</option><option value="directional">Направленные брызги</option><option value="impacts">Попадания</option></select><button id="pause">Пауза</button><button id="step">Кадр +1</button><button id="restart">Сначала</button><button id="bg">Светлый фон</button><label>Скорость <select id="speed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><span id="status">Загрузка…</span></nav><main id="grid"></main>
<script src="manifest.js"></script><script>
const pack=window.COMBAT_VFX,grid=document.querySelector('#grid');let elapsed=0,paused=false,last=performance.now(),cards=[];
const mode={destroy:'однократно → исчезновение',loop:'цикл до удаления игровым миром',decal:'однократно → неподвижный след'};
for(const e of pack.effects){const article=document.createElement('article');article.dataset.id=e.id;article.dataset.category=e.category;const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const h=document.createElement('h2');h.textContent=e.label;const small=document.createElement('small');small.textContent=e.id+' · '+mode[e.persistence];article.append(canvas,h,small);grid.append(article);const img=new Image();img.src='effects/'+e.id+'/spritesheet.png';cards.push({e,article,canvas,img});}
function frameIndex(e){const n=Math.floor(elapsed/e.durationMs);if(e.persistence==='decal')return Math.min(5,n);if(e.persistence==='loop')return n%6;return Math.min(5,Math.floor((elapsed%(e.durationMs*6+650))/e.durationMs));}
function draw(){for(const{e,article,canvas,img}of cards){const index=frameIndex(e);article.dataset.frame=index;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,256,256);ctx.imageSmoothingEnabled=false;if(img.complete&&img.naturalWidth)ctx.drawImage(img,index*e.frameWidth,0,e.frameWidth,e.frameHeight,0,0,256,256);}document.querySelector('#status').textContent=cards.filter(c=>c.img.complete&&c.img.naturalWidth).length+'/16 листов загружено';}
document.querySelector('#category').onchange=event=>cards.forEach(c=>c.article.hidden=event.target.value!=='all'&&c.e.category!==event.target.value);
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Продолжить':'Пауза';};
document.querySelector('#step').onclick=()=>{paused=true;document.querySelector('#pause').textContent='Продолжить';elapsed+=160;draw();};
document.querySelector('#restart').onclick=()=>{elapsed=0;draw();};document.querySelector('#bg').onclick=()=>document.body.classList.toggle('light');
function tick(now){if(!paused)elapsed+=(now-last)*Number(document.querySelector('#speed').value);last=now;draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
window.VFX_REVIEW={cards,setTime(ms){elapsed=ms;paused=true;document.querySelector('#pause').textContent='Продолжить';draw();}};
</script></html>
