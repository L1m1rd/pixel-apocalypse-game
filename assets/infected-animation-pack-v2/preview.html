<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заражённые · 4 направления</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111815;color:#e3e6df;font:15px system-ui}header{padding:28px 32px;border-bottom:1px solid #36473c}h1{font-size:32px;margin:8px 0}.eyebrow{font:12px monospace;letter-spacing:3px;color:#d0af72}p{color:#a9b7ac;line-height:1.6;max-width:970px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0 0}select,button{font:inherit;color:#e3e6df;background:#26382c;border:1px solid #4c6454;padding:10px 13px;border-radius:5px}button{cursor:pointer}main{padding:22px 32px;max-width:1350px;margin:auto}.row{margin-bottom:28px}.row h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid #34473a;border-radius:7px;overflow:hidden;background:#1b281f}.card h3{font-size:14px;margin:12px 14px}.stage{display:grid;place-items:center;background:repeating-conic-gradient(#27382d 0% 25%,#213027 0% 50%) 50%/24px 24px}.stage canvas{width:100%;max-width:256px;image-rendering:pixelated}.meta{padding:10px 14px;font:12px monospace;line-height:1.6;color:#aebbb0}a{color:#e2c387;text-decoration:none}.hot{color:#ffb377}.light .stage{background:#cbd1c6}.small{font-size:12px;color:#acb9af}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}header,main{padding:20px}}</style>
<header><div class="eyebrow">INFECTED · ANIMATION PACK V2</div><h1>Все движения. Четыре направления.</h1><p>6 заражённых · 96 анимаций · 576 кадров. Выберите заражённого и сравните ожидание, ходьбу, бег и атаку спереди, слева, справа и со спины. Атаки здесь повторяются для просмотра; в игровых настройках они однократные.</p><div class="controls"><label>Заражённый <select id="monster"></select></label><button id="pause">Пауза</button><button id="step">Следующий кадр</button><label>Скорость <select id="speed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option><option value="2">2×</option></select></label><button id="background">Светлый фон</button><span id="status" class="small">Загрузка…</span></div></header>
<main id="content"></main><script src="manifest.js"></script><script>
const pack=window.INFECTED_PACK,dirs=pack.directions;
const dirNames={south:'↓ Спереди',west:'← Слева',east:'→ Справа',north:'↑ Со спины'};
const stateNames={idle:'Ожидание',walk:'Ходьба',run:'Бег',attack:'Атака'};
const pictures=new Map();let loaded=0,cards=[],time=0,last=performance.now(),playing=true,stepOffset=0;
for(const m of pack.monsters){const option=document.createElement('option');option.value=m.id;option.textContent=m.name;document.querySelector('#monster').append(option);for(const d of dirs){const img=new Image();img.onload=()=>{loaded++;document.querySelector('#status').textContent=loaded+'/24 листов загружено'};img.onerror=()=>document.querySelector('#status').textContent='Ошибка: '+m.id+'/'+d;img.src=m.id+'/'+d+'/spritesheet.png';pictures.set(m.id+'/'+d,img);}}
function render(){const m=pack.monsters.find(m=>m.id===document.querySelector('#monster').value);document.querySelector('#content').replaceChildren();cards=[];for(const state of pack.frameOrder){const section=document.createElement('section');section.className='row';section.innerHTML='<h2>'+stateNames[state]+' <span class="small">· '+m.frameSize+' × '+m.frameSize+' px</span></h2><div class="grid"></div>';for(const dir of dirs){const a=m.directions[dir].animations[state];const card=document.createElement('article');card.className='card';card.innerHTML='<h3>'+dirNames[dir]+'</h3><div class="stage"><canvas width="256" height="256" data-state="'+state+'" data-direction="'+dir+'"></canvas></div><div class="meta"><span class="frame"></span> · '+a.durationMs+' мс<br><a href="'+m.id+'/'+dir+'/previews/'+state+'.gif">GIF ↗</a> · <a href="'+m.id+'/'+dir+'/spritesheet.png">PNG-лист ↗</a></div>';section.querySelector('.grid').append(card);cards.push({m,state,dir,a,row:pack.frameOrder.indexOf(state),canvas:card.querySelector('canvas'),label:card.querySelector('.frame')});}document.querySelector('#content').append(section);}}
document.querySelector('#monster').onchange=()=>{time=0;stepOffset=0;render()};
document.querySelector('#pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'Пауза':'Продолжить'};
document.querySelector('#step').onclick=()=>{playing=false;document.querySelector('#pause').textContent='Продолжить';stepOffset++};
document.querySelector('#background').onclick=()=>document.body.classList.toggle('light');
function tick(now){if(playing)time+=(now-last)*Number(document.querySelector('#speed').value);last=now;for(const c of cards){const image=pictures.get(c.m.id+'/'+c.dir);if(!image.complete||!image.naturalWidth)continue;const i=(Math.floor(time/c.a.durationMs)+stepOffset)%6,s=c.m.frameSize,ctx=c.canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,256,256);const zoom=Math.floor(256/s),d=s*zoom;ctx.drawImage(image,i*s,c.row*s,s,s,(256-d)/2,(256-d)/2,d,d);c.label.textContent='Кадр '+(i+1)+'/6'+(c.state==='attack'&&i===3?' · КОНТАКТ':'');c.label.className='frame'+(c.state==='attack'&&i===3?' hot':'');}requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
</script></html>
