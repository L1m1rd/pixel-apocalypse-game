<!doctype html><html lang="ru"><meta charset="utf-8"><title>Новые заражённые — анимации на просмотр</title>
<style>*{box-sizing:border-box}body{margin:24px;background:#141b16;color:#e6e8dd;font:15px system-ui}h1{font-size:27px;margin-bottom:8px}p{color:#afbdac;max-width:1100px;line-height:1.5}nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0;position:sticky;top:0;background:#141b16ec;padding:12px 0;z-index:2}button,select{background:#2e3a30;color:inherit;border:1px solid #62745d;padding:9px;border-radius:5px}#grid{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:14px}article{border:1px solid #3e503f;border-radius:8px;background:#202d24;overflow:hidden}h2{font-size:16px;margin:12px 14px 6px}small{display:block;color:#b8c7b0;margin:6px 14px 14px}canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;background:#26332c}.light canvas{background:#c7cfba}.empty{padding:20px;color:#c6b39b}@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){#grid{grid-template-columns:1fr}}</style>
<h1>18 новых заражённых — полный набор анимаций</h1><p>Утверждённый набор анимаций. Классы внутри каждого вида: A — слабый, B — средний, C — сильный. Старые частицы, кровь и споры сохранены в прежних наборах без изменений. Это просмотр графики, игровой код не добавлен.</p>
<nav><select id="type"></select><select id="skin"><option value="all">Все классы</option><option value="A">A — слабый</option><option value="B">B — средний</option><option value="C">C — сильный</option></select><select id="action"></select><select id="direction"><option value="all">Четыре направления</option><option value="south">Спереди / вниз</option><option value="west">Влево</option><option value="east">Вправо</option><option value="north">Со спины / вверх</option></select><button id="pause">Пауза</button><button id="step">Кадр +1</button><button id="restart">Сначала</button><button id="bg">Светлый фон</button><select id="speed"><option value="0.5">Скорость 0,5×</option><option value="1" selected>Скорость 1×</option><option value="2">Скорость 2×</option></select><span id="status">Загрузка…</span></nav><main id="grid"></main>
<script src="manifest.js"></script><script>
const pack=window.REDESIGNED_INFECTED,grid=document.querySelector('#grid'),sel=id=>document.querySelector('#'+id),images=new Map();let cards=[],elapsed=0,paused=false,last=performance.now();const errors=[];document.querySelector('h1').textContent=pack.totalCharacters+' новых заражённых — анимации';
const labels={idle:'Ожидание',walk:'Ходьба',run:'Бег / рывок',attack:'Атака',hurt:'Получение урона',stunned:'Оглушение',knockback:'Отбрасывание',death:'Смерть и тело',throw_growth:'Бросок нароста',charge_start:'Подготовка тарана',charge_loop:'Бег тарана',charge_impact:'Столкновение тарана',heavy_combo:'Двойной удар',ground_slam:'Удар по земле',phase2_roar:'Рёв второй фазы',phase3_enrage:'Переход в ярость'},dirs={south:'Спереди / вниз',west:'Левый бок',east:'Правый бок',north:'Со спины / вверх'};
for(const c of pack.characters)for(const d of pack.directions){const key=c.id+'/'+d,img=new Image();img.onerror=()=>errors.push(key);img.src=key+'/spritesheet.png';images.set(key,img);}
sel('type').add(new Option('Все виды','all'));for(const c of pack.characters)if(![...sel('type').options].some(o=>o.value===c.type))sel('type').add(new Option(c.typeName,c.type));if(sel('type').options.length>1)sel('type').selectedIndex=1;
function updateActions(){const previous=sel('action').value,chars=pack.characters.filter(c=>sel('type').value==='all'||c.type===sel('type').value);const states=[...new Set(chars.flatMap(c=>c.frameOrder))];sel('action').replaceChildren();for(const s of states)sel('action').add(new Option(labels[s]||s,s));if(states.includes(previous))sel('action').value=previous;}
function render(){cards=[];grid.replaceChildren();elapsed=0;for(const c of pack.characters){if(sel('type').value!=='all'&&c.type!==sel('type').value)continue;if(sel('skin').value!=='all'&&c.grade!==sel('skin').value)continue;for(const d of pack.directions){if(sel('direction').value!=='all'&&d!==sel('direction').value)continue;const a=c.directions[d].animations[sel('action').value];if(!a)continue;const article=document.createElement('article');article.dataset.character=c.id;article.dataset.direction=d;article.dataset.state=sel('action').value;const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const h=document.createElement('h2');h.textContent=c.id+' · '+c.name+' · класс '+c.grade;const small=document.createElement('small');small.textContent=dirs[d]+' · '+labels[sel('action').value];article.append(canvas,h,small);grid.append(article);cards.push({c,d,a,article,canvas});}}
 if(!cards.length){const p=document.createElement('p');p.className='empty';p.textContent='Для выбранного вида этот приём не предусмотрен.';grid.append(p);}draw();}
function index(a,state){const n=Math.floor(elapsed/a.durationMs);if(state==='death')return Math.min(5,n);return a.repeat===-1?n%6:Math.min(5,Math.floor((elapsed%(a.durationMs*6+750))/a.durationMs));}
function draw(){for(const card of cards){const{c,d,a,article,canvas}=card,state=sel('action').value,i=index(a,state),ctx=canvas.getContext('2d'),img=images.get(c.id+'/'+d),size=c.frameSize;article.dataset.frame=i;ctx.clearRect(0,0,256,256);ctx.imageSmoothingEnabled=false;if(img.complete&&img.naturalWidth){const factor=Math.floor(256/size),side=factor*size,pad=(256-side)/2;ctx.drawImage(img,i*size,c.frameOrder.indexOf(state)*size,size,size,pad,pad,side,side);}}
 const loaded=[...images.values()].filter(i=>i.complete&&i.naturalWidth).length;sel('status').textContent=loaded+'/'+images.size+' листов · '+cards.length+' анимаций';}
sel('type').onchange=()=>{updateActions();render();};for(const id of ['skin','action','direction'])sel(id).onchange=render;sel('pause').onclick=()=>{paused=!paused;sel('pause').textContent=paused?'Продолжить':'Пауза';};sel('step').onclick=()=>{paused=true;sel('pause').textContent='Продолжить';elapsed+=(cards[0]?.a.durationMs||100);draw();};sel('restart').onclick=()=>{elapsed=0;draw();};sel('bg').onclick=()=>document.body.classList.toggle('light');updateActions();render();
function tick(now){if(!paused)elapsed+=(now-last)*Number(sel('speed').value);last=now;draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
window.ANIMATION_REVIEW={pack,images,get cards(){return cards;},errors,setTime(ms){elapsed=ms;paused=true;sel('pause').textContent='Продолжить';draw();}};
</script></html>
