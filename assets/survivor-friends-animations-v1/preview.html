<!doctype html><html lang="ru"><meta charset="utf-8"><title>Шесть выживших — анимации</title><style>*{box-sizing:border-box}body{margin:24px;background:#161e1b;color:#e7e8df;font:15px system-ui}h1{font-size:26px}p{max-width:1000px;color:#b3c1b4;line-height:1.5}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;padding:12px 0;background:#161e1bf0;z-index:1}select,button{font:inherit;background:#2d3a32;color:inherit;padding:9px;border:1px solid #687b66;border-radius:5px}#grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}article{border:1px solid #455949;border-radius:8px;overflow:hidden;background:#202b24}canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;background:#28382d}.light canvas{background:#c7cdbb}h2{font-size:17px;margin:12px}small{display:block;margin:12px;color:#bcc7b7}@media(max-width:800px){#grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){#grid{grid-template-columns:1fr}}</style>
<h1>Шесть выживших — полный набор анимаций</h1><p>36 действий · четыре направления · отдельные слои тела без рюкзаков и предметов. Оружие, инструменты и расходники добавляются отдельно. Выберите действие для просмотра. Смерть заканчивается неподвижным телом.</p><nav><select id="character"><option value="all">Все персонажи</option></select><select id="group"><option value="all">Все группы</option></select><select id="action"></select><select id="direction"><option value="all">Все направления</option><option value="south">Спереди</option><option value="west">Левый бок</option><option value="east">Правый бок</option><option value="north">Со спины</option></select><button id="pause">Пауза</button><button id="step">Кадр +1</button><button id="restart">Сначала</button><button id="bg">Светлый фон</button><select id="speed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><span id="status"></span></nav><main id="grid"></main><script src="manifest.js"></script><script>
const pack=window.FRIENDS_ANIMATIONS,$=id=>document.getElementById(id),images=new Map(),errors=[],groups={movement:'Движение',stealth:'Скрытность',interaction:'Взаимодействия',survival:'Выживание',work:'Работа',combat:'Ближний бой и бросок',firearm:'Огнестрельное оружие',reaction:'Реакции и смерть'},dirs={south:'Спереди',west:'Левый бок',east:'Правый бок',north:'Со спины'};let cards=[],elapsed=0,paused=false,last=performance.now();for(const c of pack.characters){$('character').add(new Option(c.name,c.id));for(const d of pack.directions){const im=new Image();im.src=c.id+'/'+d+'/spritesheet.png';im.onerror=()=>errors.push(im.src);images.set(c.id+'/'+d,im);}}for(const [id,label]of Object.entries(groups))$('group').add(new Option(label,id));
function actions(){const prior=$('action').value;$('action').replaceChildren();const c=pack.characters[0];for(const state of c.frameOrder)if($('group').value==='all'||c.actions[state].group===$('group').value)$('action').add(new Option(c.actions[state].label,state));if([...$('action').options].some(o=>o.value===prior))$('action').value=prior;}
function render(){cards=[];$('grid').replaceChildren();elapsed=0;for(const c of pack.characters){if($('character').value!=='all'&&$('character').value!==c.id)continue;for(const d of pack.directions){if($('direction').value!=='all'&&$('direction').value!==d)continue;const article=document.createElement('article'),canvas=document.createElement('canvas'),h=document.createElement('h2'),small=document.createElement('small');canvas.width=288;canvas.height=288;h.textContent=c.name;small.textContent=dirs[d]+' · '+c.actions[$('action').value].label;article.append(canvas,h,small);article.dataset.character=c.id;article.dataset.direction=d;$('grid').append(article);cards.push({c,d,canvas,article});}}draw();}
function draw(){for(const {c,d,canvas,article}of cards){const state=$('action').value,a=c.actions[state],n=Math.floor(elapsed/a.durationMs),i=state==='death'?Math.min(5,n):a.repeat===-1?n%6:Math.min(5,Math.floor(elapsed%(a.durationMs*6+750)/a.durationMs));article.dataset.frame=i;const im=images.get(c.id+'/'+d),ctx=canvas.getContext('2d');ctx.clearRect(0,0,288,288);ctx.imageSmoothingEnabled=false;if(im.complete&&im.naturalWidth)ctx.drawImage(im,i*96,c.frameOrder.indexOf(state)*96,96,96,0,0,288,288);}$('status').textContent=[...images.values()].filter(i=>i.complete&&i.naturalWidth).length+'/'+images.size+' листов · '+cards.length+' анимаций';}
$('group').onchange=()=>{actions();render();};for(const id of ['character','action','direction'])$(id).onchange=render;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Продолжить':'Пауза';};$('step').onclick=()=>{paused=true;$('pause').textContent='Продолжить';elapsed+=pack.characters[0].actions[$('action').value].durationMs;draw();};$('restart').onclick=()=>{elapsed=0;draw();};$('bg').onclick=()=>document.body.classList.toggle('light');actions();render();function tick(now){if(!paused)elapsed+=(now-last)*Number($('speed').value);last=now;draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);window.ANIMATION_REVIEW={pack,images,errors,get cards(){return cards;},setTime(ms){elapsed=ms;paused=true;draw();}};
</script></html>
