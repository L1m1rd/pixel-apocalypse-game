<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Животные — A / B / C</title><style>
:root{font:15px system-ui;color-scheme:dark;background:#17201b;color:#e2eadb}*{box-sizing:border-box}body{margin:0}header{padding:25px 4vw;background:#1e2b22;border-bottom:1px solid #45533f;position:sticky;top:0;z-index:2}h1{font-size:27px;margin:0 0 8px}p{margin:7px 0;color:#b7c4b0}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 12px}input,select,button{background:#29372b;color:#e4eadf;border:1px solid #5c6b51;border-radius:6px;padding:10px 13px;font:inherit}input{min-width:240px}button{cursor:pointer}#count{color:#dccda1}main{padding:24px 4vw}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}.card{background:#223026;border:1px solid #45533f;border-radius:8px;overflow:hidden}h2{font-size:17px;margin:15px 16px 5px}.meta{font-size:12px;color:#b5c2ab;margin:0 16px 12px}.variants{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.variant{text-align:center;padding:10px 4px;background:repeating-conic-gradient(#344038 0 25%,#29342d 0 50%) 50%/16px 16px}.variant img{height:160px;width:100%;object-fit:contain;image-rendering:pixelated}.variant a{display:block;color:#e1d1a0;text-decoration:none;font-size:12px;padding:5px 0}.links{padding:13px 16px;display:flex;gap:16px;font-size:12px}.links a{color:#c5d6b7}.warning{padding:0 16px 12px;font-size:12px;color:#ddc086}.light .variant{background:#dce2d4}.light .variant a{color:#31442d}footer{padding:20px 4vw;color:#afbea7;font-size:13px}
</style><style>.variants{grid-template-columns:1fr}.all-variants .variants{grid-template-columns:repeat(3,1fr)}</style><header><h1>Животные · выбран вариант B</h1><p>Второй облик выбран у всех 20 видов. Четыре статичных ракурса; A/C сохранены для сравнения.</p><div class="controls"><input id="search" placeholder="Найти животное…" aria-label="Поиск животного"><select id="direction" aria-label="Ракурс"><option value="west">Слева</option><option value="east">Справа</option><option value="south">Спереди</option><option value="north">Сзади</option></select><button id="background">Светлый фон</button><button id="variants">Показать A / B / C</button></div><div id="count"></div></header><main><div id="grid"></div></main><footer>Выбран вариант B. Это просмотр статичных ракурсов; движения находятся в отдельном наборе wildlife-animations-v1.</footer><script src="manifest.js"></script><script>
const data=window.WILDLIFE,$=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let showAll=false;
function render(){const q=$('#search').value.trim().toLowerCase(),d=$('#direction').value,items=data.species.filter(a=>(a.name+' '+a.id).toLowerCase().includes(q));$('#count').textContent=`${data.speciesCount} видов · активный облик B · ${data.speciesCount} выбранных обликов · показано ${items.length} видов`;
$('#grid').innerHTML=items.map(a=>`<article class="card" data-id="${a.id}"><h2>${esc(a.name)}</h2><p class="meta">Выбран B · 4 ракурса · ${a.canvas} × ${a.canvas} px</p><div class="variants">${(showAll?a.variants:a.variants.filter(v=>v.variant==='B')).map(v=>`<div class="variant"><img loading="lazy" src="${v.files[d]}" alt="${esc(a.name)} — ${v.variant}"><a href="${v.files[d]}" target="_blank">Вариант ${v.variant}${v.variant==='B'?' · выбран':''} · PNG</a><a href="${v.sheet}" target="_blank">Лист ракурсов</a></div>`).join('')}</div><div class="links"><a href="${a.overview}" target="_blank">Все ракурсы</a><a href="${a.source}" target="_blank">Исходник</a></div>${a.warnings.length?'<div class="warning">Проверьте мелкие детали на краях исходной сетки.</div>':''}</article>`).join('')||'<p>Ничего не найдено</p>';}
$('#search').addEventListener('input',render);$('#direction').addEventListener('change',render);$('#background').onclick=()=>{const light=document.body.classList.toggle('light');$('#background').textContent=light?'Тёмный фон':'Светлый фон';};$('#variants').onclick=()=>{showAll=!showAll;document.body.classList.toggle('all-variants',showAll);$('#variants').textContent=showAll?'Только выбранный B':'Показать A / B / C';render();};render();
</script></html>
